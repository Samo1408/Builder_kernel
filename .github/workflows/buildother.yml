name: Build Kernel 2

on:
  workflow_dispatch:
    inputs:
      BRANCH:
        description: Kernel branch
        default: 'main'
        required: true
        type: string
      DEFCONFIG:
        description: Defconfig
        default: 'rsuntk_defconfig'
        required: false
        type: string
      KSU:
        description: Add OriginSU support
        type: boolean
        default: false
        required: false
      UPLOAD_TO_TG:
        description: Upload to Telegram
        type: boolean
        default: false
        required: false
      UPLOAD_LKM:
        description: Upload LKM
        type: boolean
        default: false
        required: false
      NEW_CLANG:
        description: Compile with newer Clang (clang-20)
        type: boolean
        default: false
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: telegramUpload
    steps:
      - name: Get date
        id: rundate
        run: |
          sudo rm -f /etc/localtime
          sudo ln -s /usr/share/zoneinfo/Asia/Jakarta /etc/localtime
          echo "REPO_DATE=$(date)" >> "$GITHUB_OUTPUT"

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          path: kernel_root
          repository: Samo1408/android_kernel_samsung_m32
          ref: ${{ inputs.BRANCH }}
          show-progress: false
          fetch-depth: 1
          # OriginSU is installed by build.sh only when KSU=true.
          submodules: false

      - name: Prepare dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc cpio flex bison aptitude git python-is-python3 \
            tar perl wget aria2 curl lz4 zip unzip libssl-dev build-essential

      - name: Fetch toolchains
        run: |
          mkdir toolchains
          cd toolchains
          if [[ "${{ github.event.inputs.NEW_CLANG }}" = "true" ]]; then
            #URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-u-beta-1-gpl/clang-r458507.tar.gz"
            echo "INFO: Downloading newer clang"
            aria2c https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz
            mkdir clang && mv *.gz clang && cd clang && tar -xf *.gz && rm *.gz
            cd ../..
          else
            curl -LSs "https://raw.githubusercontent.com/rsuntk/toolchains/refs/heads/README/clone.sh" | bash -s clang-12
            mv clang* clang
          fi
          curl -LSs "https://raw.githubusercontent.com/rsuntk/toolchains/refs/heads/README/clone.sh" | bash -s androidcc-4.9
          curl -LSs "https://raw.githubusercontent.com/rsuntk/toolchains/refs/heads/README/clone.sh" | bash -s arm-gnu
        working-directory: kernel_root

      - name: Build kernel
        id: buildKernel
        working-directory: kernel_root
        shell: bash
        env:
          KBUILD_BUILD_USER: samo
          KBUILD_BUILD_HOST: samo1408
          IS_CI: 'true'
          DEVICE: M325FV
          DEVICE_ID: M32
          TARGET_PRODUCT: m32
          LLVM: '1'
          LLVM_IAS: '1'
          KERNELSU: ${{ inputs.KSU }}
        run: |
          set -euo pipefail

          # Keep the original toolchain paths used by the working workflow.
          export PATH="$(pwd)/toolchains/clang/bin:$PATH"
          export CROSS_COMPILE="$(pwd)/toolchains/google/bin/aarch64-linux-android-"
          export CROSS_COMPILE_COMPAT="$(pwd)/toolchains/arm-gnu/bin/arm-linux-gnueabi-"
          export CROSS_COMPILE_ARM32="$CROSS_COMPILE_COMPAT"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          BUILD_START="$(date)"
          DEFCONFIG="${{ inputs.DEFCONFIG }}"
          SELINUX_STATE="Enforcing"

          echo "KERNELSU=$KERNELSU"
          bash ./build.sh kernel --jobs "$(nproc --all)" "$DEFCONFIG"

          if [[ "$KERNELSU" == "true" ]]; then
            test -d KernelSU/.git
            KSU_REV_COUNT="$(git -C KernelSU rev-list --count HEAD)"
            KSU_VERSION="$((10200 + KSU_REV_COUNT))"
          else
            KSU_VERSION="Disabled"
          fi
          echo "- OriginSU version: $KSU_VERSION"

          if [[ -f include/linux/susfs.h ]]; then
            SUSFS_VERSION="$(grep -E '^#define SUSFS_VERSION' include/linux/susfs.h | awk '{print $3}' | tr -d '"')"
          else
            SUSFS_VERSION="Not available"
          fi

          test -x ./getutsrel
          LOCALVERSION="$(./getutsrel)"
          CLANG_VERSION="$(clang -v 2>&1 | grep ' version ' | sed 's/[[:space:]]*$//' | head -n1)"

          cat > buildDetails.txt <<EOF
          Localversion: ${LOCALVERSION}
          Clang version: ${CLANG_VERSION}
          Build date: ${BUILD_START}
          Defconfig: ${DEFCONFIG}
          OriginSU: ${KSU_VERSION}
          Susfs: ${SUSFS_VERSION}
          LTO: off
          SELinux: ${SELINUX_STATE}
          EOF

          echo "TITLE=Galaxy ${DEVICE_ID} Kernel" >> "$GITHUB_ENV"

          echo
          echo "===================================================="
          strings out/arch/arm64/boot/Image | grep -m1 "Linux version"
          echo "===================================================="

          test -s out/arch/arm64/boot/Image
          test -f out/.config
          mv out/.config out/build_config.txt

          gitsha1="$(git rev-parse --short HEAD)"
          buildDetails="$(make -s kernelversion)-${DEVICE}_${gitsha1}-$(date +'%Y%m%d%H%M%S')"
          echo "buildDetails=${buildDetails}" >> "$GITHUB_OUTPUT"

      - name: Upload config
        uses: actions/upload-artifact@v4
        with:
          name: Config-${{ steps.buildKernel.outputs.buildDetails }}
          path: kernel_root/out/build_config.txt
          if-no-files-found: error

      - name: Upload kernel image and DTB
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ steps.buildKernel.outputs.buildDetails }}
          path: |
            kernel_root/out/arch/arm64/boot/Image
            kernel_root/out/arch/arm64/boot/Image*
            kernel_root/out/arch/arm64/boot/dts/mediatek/*.dtb
          if-no-files-found: error

      - name: Upload AnyKernel3 flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: M32-${{ steps.buildKernel.outputs.buildDetails }}
          path: kernel_root/AnyKernel3-*.zip
          if-no-files-found: error
          compression-level: 9

      - name: Upload to Telegram
        if: ${{ inputs.UPLOAD_TO_TG }}
        working-directory: kernel_root
        env:
          CHAT_ID: ${{ secrets.CHAT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${BOT_TOKEN:-}" ]]; then
            ZIP="$(find "$(pwd)" -maxdepth 1 -type f -name '*.zip' -print -quit)"
            test -n "$ZIP"
            git clone --depth=1 https://github.com/rsuntk/rsuntkBotScript.git i
            cp ./i/* .
            rm -rf i
            bash ./rsuntkbot.sh "$ZIP" "$(cat buildDetails.txt)"
          else
            echo "Telegram upload skipped: BOT_TOKEN secret is empty."
          fi

      - name: Strip LKMs
        if: ${{ inputs.UPLOAD_LKM }}
        working-directory: kernel_root
        shell: bash
        run: |
          set -euo pipefail
          rm -f ./*.zip
          mkdir -p ../kernel_object_tmp kernel_object

          find . -type f -name '*.ko' -not -path './kernel_object/*' \
            -exec mv -t ../kernel_object_tmp {} +

          shopt -s nullglob
          MODULES=(../kernel_object_tmp/*.ko)

          if (( ${#MODULES[@]} == 0 )); then
            echo "No .ko modules were produced; LKM upload will be empty."
            exit 0
          fi

          for file in "${MODULES[@]}"; do
            echo "- Stripping $(basename "$file")"
            toolchains/clang/bin/llvm-strip "$file" --strip-unneeded
          done

          mv ../kernel_object_tmp/*.ko kernel_object/

      - name: Upload LKM
        if: ${{ inputs.UPLOAD_LKM }}
        uses: actions/upload-artifact@v4
        with:
          name: LKM-${{ steps.buildKernel.outputs.buildDetails }}
          path: kernel_root/kernel_object/*
          if-no-files-found: warn
