name: Build Kernel M12
on:
  workflow_dispatch:
    inputs:
      BRANCH:
        description: Kernel branch
        default: '2nd'
        required: true
      DEFCONFIG: 
        description: Defconfig
        default: 'physwizz_defconfig'
        required: false
      KSU:
        description: Add KernelSU support
        type: boolean
      UPLOAD_TO_TG:
        description: Upload to Telegram
        type: boolean
      UPLOAD_LKM:
        description: Upload LKM
        type: boolean
      NEW_CLANG:
        description: Compile with newer Clang (clang-20)
        type: boolean
        
jobs:
  build:
    runs-on: ubuntu-latest
    environment: telegramUpload
    steps:
    - name: Get date
      id: rundate
      run: |
        sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime
        echo "REPO_DATE=$(date)" >> $GITHUB_OUTPUT
    
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        path: kernel_root
        repository: "Samo1408/Kernel_M127G"
        ref: ${{ github.event.inputs.BRANCH }}
        fetch-depth: 1
        submodules: 'recursive'  # إذا كان KernelSU أو غيرها من submodules
        
    - name: Prepare dependencies
      run: |
        sudo apt update
        sudo apt install -y bc cpio flex bison git python3 perl tar wget aria2 curl lz4 libssl-dev

    - name: Fetch toolchains
      run: |
        mkdir -p toolchains
        cd toolchains
        
        # اختيار رابط clang بناءً على الإدخال
        if [[ "${{ github.event.inputs.NEW_CLANG }}" == "true" ]]; then
          # Clang 20 (اخر إصدار متاح من AOSP)
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz"
        else
          # Clang 17 مستقر
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-gsi/clang-r450784d.tar.gz"
        fi
        
        echo "Downloading clang from: $URL"
        mkdir clang && cd clang
        wget -q --show-progress -O clang.tar.gz "$URL"
        tar -xf clang.tar.gz && rm clang.tar.gz
        cd ..
        
        # سلسلة أدوات GCC (ضرورية لبعض الرؤوس)
        curl -LSs https://raw.githubusercontent.com/rsuntk/toolchains/refs/heads/README/clone.sh | bash -s androidcc-4.9
        mv androidcc-4.9 google
      working-directory: kernel_root

    - name: Build kernel
      id: buildKernel
      run: |
        export PATH=$(pwd)/toolchains/clang/bin:$PATH
        export CROSS_COMPILE=$(pwd)/toolchains/google/bin/aarch64-linux-android-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export KBUILD_BUILD_USER="samo"
        export KBUILD_BUILD_HOST="samo1408"
        export BUILD_START=$(date)
        export SELINUX_STATE="Enforcing"
        export IS_CI=true
        export DEFCONFIG="${{ github.event.inputs.DEFCONFIG }}"
        export KERNELSU="${{ github.event.inputs.KSU }}"
        export LLVM=1
        export LLVM_IAS=1
        
        # التحقق من وجود سكربت build.sh
        if [[ ! -f "build.sh" ]]; then
          echo "ERROR: build.sh not found in kernel root!"
          exit 1
        fi
        
        bash build.sh kernel --jobs $(nproc --all) "$DEFCONFIG"
        
        # حساب إصدار KernelSU
        if [[ "${{ github.event.inputs.KSU }}" == "true" ]]; then
          if [[ -d "KernelSU" ]]; then
            KSU_REV_COUNT=$(cd KernelSU && git rev-list --count HEAD 2>/dev/null || echo 0)
            KSU_VERSION=$((10200 + KSU_REV_COUNT))
          else
            KSU_VERSION="KernelSU folder missing"
          fi
        else
          KSU_VERSION="No KernelSU"
        fi
        echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
        
        # الحصول على إصدار susfs
        if [[ -f "include/linux/susfs.h" ]]; then
          SUSFS_VERSION=$(grep -E '^#define SUSFS_VERSION' include/linux/susfs.h | cut -d' ' -f3 | tr -d '"')
        else
          SUSFS_VERSION="Not available"
        fi
        
        # توليد buildDetails.txt بدون الحاجة لسكربت خارجي
        cat > buildDetails.txt <<EOF
        Localversion: $(make kernelversion 2>/dev/null || echo "unknown")
        Clang version: $(clang -v 2>&1 | grep 'version' | head -1 | sed 's/^[^0-9]*//')
        Build date: $BUILD_START
        Defconfig: $DEFCONFIG
        KernelSU: $KSU_VERSION
        Susfs: $SUSFS_VERSION
        LTO: full
        SELinux: $SELINUX_STATE
        EOF
        cat buildDetails.txt
        
        # نسخ ملف config للرفع
        cp out/.config out/build_config.txt
        
        # إنشاء اسم الإصدار
        git_sha=$(git rev-parse --short HEAD)
        kernel_ver=$(make kernelversion | tr -d '\n')
        build_tag="${kernel_ver}-M127G_${git_sha}-$(date +'%Y%m%d%H%M%S')"
        echo "buildDetails=$build_tag" >> $GITHUB_OUTPUT
        echo "TITLE=Galaxy M12 Kernel" >> $GITHUB_ENV
        
        # طباعة معلومات الإصدار من الـ Image
        echo "===================================================="
        strings out/arch/arm64/boot/Image | grep "Linux version" || echo "Image not found or no version string"
        echo "===================================================="
      working-directory: kernel_root
      
    - name: Build flashable ZIP (AnyKernel3)
      if: github.event.inputs.UPLOAD_TO_TG == 'true'
      run: |
        # التأكد من وجود مجلد AnyKernel3
        if [[ ! -d "AnyKernel3" ]]; then
          echo "WARNING: AnyKernel3 folder not found, skipping ZIP creation"
          exit 0
        fi
        # نسخ Image.gz و dtb إلى قالب AnyKernel3
        cp out/arch/arm64/boot/Image.gz AnyKernel3/
        mkdir -p AnyKernel3/dtb
        cp out/arch/arm64/boot/dts/mediatek/*.dtb AnyKernel3/dtb/ 2>/dev/null || true
        
        # إنشاء ملف zip
        cd AnyKernel3
        zip -r9 "../M12-${{ steps.buildKernel.outputs.buildDetails }}.zip" ./*
        cd ..
      working-directory: kernel_root
      
    - name: Upload config
      uses: actions/upload-artifact@v4
      with:
        name: Config-${{ steps.buildKernel.outputs.buildDetails }}
        path: kernel_root/out/build_config.txt
        
    - name: Upload kernel and dtb
      uses: actions/upload-artifact@v4
      with:
        name: Build-${{ steps.buildKernel.outputs.buildDetails }}
        path: |
          kernel_root/out/arch/arm64/boot/Image.gz
          kernel_root/out/arch/arm64/boot/dts/mediatek/*.dtb
          
    - name: Upload flashable ZIP
      if: github.event.inputs.UPLOAD_TO_TG == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: M12-Kernel-${{ steps.buildKernel.outputs.buildDetails }}
        path: kernel_root/*.zip
        compression-level: 9
        
    - name: Upload to Telegram
      if: github.event.inputs.UPLOAD_TO_TG == 'true'
      env:
        CHAT_ID: ${{ secrets.CHAT_ID }}
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      run: |
        if [[ -z "$BOT_TOKEN" || -z "$CHAT_ID" ]]; then
          echo "Telegram secrets missing, skipping upload"
          exit 0
        fi
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -1)
        if [[ -z "$ZIP_FILE" ]]; then
          echo "No zip file found to upload"
          exit 1
        fi
        git clone https://github.com/rsuntk/rsuntkBotScript.git --depth=1 bot_script
        bash bot_script/rsuntkbot.sh "$ZIP_FILE" "$(cat buildDetails.txt)"
      working-directory: kernel_root
        
    - name: Strip LKMs
      if: github.event.inputs.UPLOAD_LKM == 'true'
      run: |
        mkdir -p kernel_object
        # البحث عن ملفات .ko في مجلد out
        find out -type f -name "*.ko" -exec cp {} kernel_object/ \;
        if [[ -z "$(ls kernel_object/*.ko 2>/dev/null)" ]]; then
          echo "No kernel modules found"
          exit 0
        fi
        # استخدام llvm-strip من clang الموجود
        STRIP=$(pwd)/toolchains/clang/bin/llvm-strip
        for mod in kernel_object/*.ko; do
          echo "Stripping $(basename $mod)"
          "$STRIP" --strip-unneeded "$mod"
        done
      working-directory: kernel_root
        
    - name: Upload LKM
      if: github.event.inputs.UPLOAD_LKM == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: LKM-${{ steps.buildKernel.outputs.buildDetails }}
        path: kernel_root/kernel_object/*.ko
